spring.application.name=tipsterbytefxv2
app.api.rest.enabled=false

# ─────────────────────────────────────────────
# [QUÉ]: Conexión a PostgreSQL para desarrollo (FASE 8).
# [POR QUÉ]: Se usan variables de entorno con fallback a los valores del contenedor
#            local (db_pg_tipsterbyte_fx_dev expuesto en localhost:5433). Así el
#            proyecto corre sin configuración adicional en dev y permite sobrescribir
#            credenciales por variables de entorno en otros entornos (prod).
# [ALTERNATIVAS]: Hardcodear solo credenciales; se descarta porque dificulta cambiar
#                 de BD en deploy. Solo variables de entorno sin default; se descarta
#                 porque rompería bootRun local sin setup previo.
# [RELACIONES]: infrastructure.persistence.* (FASE 8), docker-compose (FASE 9).
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tipsterbyte_fx_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─────────────────────────────────────────────
# [QUÉ]: Estrategia de generación del esquema (FASE 8).
# [POR QUÉ]: En dev (perfil por defecto) Hibernate crea/actualiza el esquema para
#            iterar rápido sobre el mapeo de entidades. En prod se valida contra el
#            esquema real (migrations formales llegan en FASE 19/20).
# [ALTERNATIVAS]: Flyway/Liquibase desde ahora; se descarta para no agregar una
#                 dependencia de migrations antes de FASE 19/20.
# [RELACIONES]: Entidades en infrastructure.persistence.entity.
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false