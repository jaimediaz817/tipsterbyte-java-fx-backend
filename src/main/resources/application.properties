spring.application.name=tipsterbytefxv2

# ─────────────────────────────────────────────
# [QUÉ]: Habilita el wiring REST completo (FASE 8.5): los controllers se registran
#        cuando app.api.rest.enabled=true. Se activó porque CU-01..04 ya cuentan con
#        los adapters reales de fuentes (#2/#3/#4) y las URLs se asocian por liga en
#        la activación (CU-04).
# [POR QUÉ]: Mantener el flag permite desactivar la capa HTTP en tests de dominio o si
#            el servicio de extracción no está disponible, sin tocar el resto.
# [ALTERNATIVAS]: Quitar el flag; se descarta porque el gate ya está en cada controller.
# [RELACIONES]: Controllers en interfaces.rest.controller (LigaController,
#               PronosticoController, SuscripcionController, PartidoController,
#               FuenteExtraccionController).
# ─────────────────────────────────────────────
app.api.rest.enabled=${APP_API_REST_ENABLED:true}

# ─────────────────────────────────────────────
# [QUÉ]: Conexión a PostgreSQL para desarrollo (FASE 8, dockerizada en FASE 9).
# [POR QUÉ]: Se usan variables de entorno con fallback a la BD aislada del
#            docker-compose de este proyecto (tipsterbytefxv2-postgres, expuesto en
#            localhost:5434, base tipsterbytefxv2_dev). No se usa la BD compartida
#            del proyecto Python (db_pg_tipsterbyte_fx_dev en :5433): cada proyecto
#            corre sobre su propia BD (decisión FASE 9). Las variables permiten
#            sobrescribir credenciales en otros entornos (prod).
# [ALTERNATIVAS]: Seguir apuntando a la BD compartida :5433; se descarta porque el
#                 usuario pidió aislamiento entre proyectos. Solo variables de entorno
#                 sin default; se descarta porque rompería bootRun local sin setup.
# [RELACIONES]: infrastructure.persistence.* (FASE 8), docker-compose.yml (FASE 9).
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:tipsterbytefxv2_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─────────────────────────────────────────────
# [QUÉ]: Estrategia de generación del esquema (FASE 8).
# [POR QUÉ]: En dev (perfil por defecto) Hibernate crea/actualiza el esquema para
#            iterar rápido sobre el mapeo de entidades. En prod se valida contra el
#            esquema real (migrations formales llegan en FASE 19/20).
# [ALTERNATIVAS]: Flyway/Liquibase desde ahora; se descarta para no agregar una
#                 dependencia de migrations antes de FASE 19/20.
# [RELACIONES]: Entidades en infrastructure.persistence.entity.
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────
# [QUÉ]: URL base del proyecto Python de extracción (FASE 8.5).
# [POR QUÉ]: Los adapters de fuentes externas (#1..#5) consumen los endpoints
#            ext-* de http://127.0.0.1:8001. Se parametriza con env fallback para
#            poder apuntar a otro host/entorno sin tocar código.
# [ALTERNATIVAS]: Hardcodear la URL en cada adapter; se descarta porque dificulta
#                 cambiar de entorno de extracción.
# [RELACIONES]: SoccerwayPaisesAdapter, SoccerwayLigasPorPaisAdapter (FASE 8.5).
# ─────────────────────────────────────────────
app.fuentes.base-url=${FUENTES_BASE_URL:http://127.0.0.1:8001}

# ─────────────────────────────────────────────
# [QUÉ]: Configuración del token JWT (FASE 11): clave de firma HS256 y expiración.
# [POR QUÉ]: La clave secreta y la duración del token se parametrizan por env con
#            fallback para dev. La expiración limita la ventana de reuso de un token
#            robado; la clave debe ser de al menos 256 bits para HS256 (JJWT lo valida).
# [ALTERNATIVAS]: Clave hardcodeada en código; se descarta porque se comprometería en
#                 VCS. RSA/RS256; se descarta por no necesitar par de claves aquí.
# [RELACIONES]: JwtTokenEmisor, JwtAuthenticationFilter (infrastructure.security).
# ─────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:tipsterbyte-fx-v2-clave-secreta-dev-muy-larga-para-hs256-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─────────────────────────────────────────────
# [QUÉ]: Configuración del cache-aside Redis (FASE 12): flag de activación, conexión
#        y TTL por tipo de dato de fuentes externas.
# [POR QUÉ]: Las lecturas de posiciones (CU-01), calendario (CU-02) y cuotas (CU-03)
#            se cachean en Redis con TTL para no golpear el scraper en cada
#            sincronización; la invalidación al sincronizar fuerza datos frescos. El
#            flag permite desactivar el cache (p.ej. en tests sin contenedor Redis)
#            cayendo en NoOpCacheLecturas sin tocar los casos de uso.
# [ALTERNATIVAS]: Caffeine (L1 local) en FASE 12; se descarta porque Redis es el cache
#                 planificado y Caffeine queda como L1 opcional en FASE 17 (el puerto
#                 CacheLecturas lo permite sin cambiar application).
# [RELACIONES]: infrastructure.cache.RedisCacheAdapter + decoradores ProveedorXxxCacheable.
# ─────────────────────────────────────────────
app.cache.enabled=${APP_CACHE_ENABLED:true}
app.cache.ttl-posiciones-seg=${CACHE_TTL_POSICIONES_SEG:300}
app.cache.ttl-calendario-seg=${CACHE_TTL_CALENDARIO_SEG:300}
app.cache.ttl-cuotas-seg=${CACHE_TTL_CUOTAS_SEG:120}
# TTL del catálogo de países (GET /paises/disponibles + validación CU-14). Lista casi
# estática (~176 países, no cambia a nivel de código ISO/nombres), por eso el TTL de 1
# mes (2.592.000 s); CU-10 lo invalida al sincronizar si hubiera cambios.
app.cache.ttl-paises-seg=${CACHE_TTL_PAISES_SEG:2592000}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# ─────────────────────────────────────────────
# [QUÉ]: Activación del scheduler de tareas programadas (FASE 12.6)
# [POR QUÉ]: Permite encender/apagar el scheduler que ejecuta tareas según cron expression.
#            Útil para desactivar en entornos donde no se quiere ejecución automática (p.ej. algunos tests o despliegues manuales).
# [ALTERNATIVAS]: No tener flag y siempre encender el scheduler; se descarta por falta de control.
# [RELACIONES]: CatalogoScheduler (infrastructure.adapter).
# ─────────────────────────────────────────────
scheduler.enabled=${SCHEDULER_ENABLED:true}
scheduler.interval=${SCHEDULER_INTERVAL:60000}