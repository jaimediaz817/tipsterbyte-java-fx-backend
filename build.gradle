buildscript {
	repositories { mavenCentral() }
	dependencies {
		// [QUÉ]: API de Flyway en el classpath de Gradle para los comandos de migración
		//        (migrar/infoMigraciones/validarMigraciones) contra la BD dev sin arrancar
		//        la app. Resuelto desde Maven Central (el plugin oficial de Gradle de
		//        Flyway no publica markers en el portal de plugins).
		classpath 'org.flywaydb:flyway-core:12.4.0'
		classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
		classpath 'org.postgresql:postgresql:42.7.7'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tipsterbyte'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// ─────────────────────────────────────────────
// Comandos de migración sobre la BD dev (:5434) usando la API de Flyway directamente.
//   ./gradlew migrar              → aplica migraciones pendientes en dev
//   ./gradlew infoMigraciones     → estado (aplicadas/pendientes)
//   ./gradlew validarMigraciones  → valida checksums contra dev
// La app también aplica migraciones automáticamente al arrancar (bootRun); estos
// comandos sirven para ejecutar/consultar SIN levantar la aplicación.
// ─────────────────────────────────────────────
def dbUrl = 'jdbc:postgresql://localhost:5434/tipsterbytefxv2_dev'
def dbUser = 'postgres'
def dbPass = 'postgres'
def flywayCfg = {
    org.flywaydb.core.Flyway.configure()
        .dataSource(dbUrl, dbUser, dbPass)
        .locations('filesystem:src/main/resources/db/migration')
        .baselineOnMigrate(true)   // dev ya tiene esquema sin historial: marca V1 sin ejecutarla
}

tasks.register('migrar') {
    group = 'flyway'
    description = 'Aplica en dev las migraciones pendientes (equivalente a lo que hace bootRun).'
    doLast {
        def resultado = flywayCfg().load().migrate()
        println "✔ Migraciones aplicadas: ${resultado.migrationsExecuted}"
    }
}

tasks.register('infoMigraciones') {
    group = 'flyway'
    description = 'Estado de las migraciones en dev: aplicadas, pendientes y futuras.'
    doLast {
        def info = flywayCfg().load().info()
        println String.format('%-8s %-40s %-14s %s', 'Version', 'Descripcion', 'Estado', 'InstaladaEn')
        info.all().each { mi ->
            def instalada = (mi.state?.displayName == 'Baseline') ? '(esquema preexistente)' : ''
            println String.format('%-8s %-40s %-14s %s',
                    mi.version ?: '-',
                    mi.description ?: '-',
                    mi.state?.displayName ?: '-',
                    instalada)
        }
    }
}

tasks.register('validarMigraciones') {
    group = 'flyway'
    description = 'Valida checksums y consistencia de las migraciones aplicadas en dev.'
    doLast {
        flywayCfg().load().validate()
        println '✔ Migraciones válidas (checksums consistentes con los archivos locales).'
    }
}

// [QUÉ]: Crea el siguiente archivo de migración con numeración correlativa automática.
// [POR QUÉ]: Evita errores de numeración manual y el doble guion bajo obligatorio.
// USO: ./gradlew nuevaMigracion -Pdescripcion=agregar_estadio_a_equipos
tasks.register('nuevaMigracion') {
	group = 'flyway'
	description = 'Crea V(n+1)__descripcion.sql en db/migration. Uso: -Pdescripcion=mi_cambio'
	doLast {
		def descripcion = project.findProperty('descripcion')
		if (!descripcion || descripcion.isBlank())
			throw new GradleException('Falta la descripción. Uso: ./gradlew nuevaMigracion -Pdescripcion=mi_cambio_en_snake_case')
		def dir = file('src/main/resources/db/migration')
		def ultimo = dir.listFiles()
				.findAll { it.name =~ /^V\d+__.*\.sql$/ }
				.collect { (it.name.replace('V', '') =~ /^\d+/)[0] }
				.collect { it.toInteger() }
				.max() ?: 0
		def archivo = new File(dir, "V${ultimo + 1}__${descripcion}.sql")
		if (archivo.exists()) throw new GradleException("Ya existe: ${archivo.name}")
		archivo.text = """-- ─────────────────────────────────────────────
-- [QUÉ]: ${descripcion.replace('_', ' ')}.
-- [POR QUÉ]: 
-- [RELACIONES]: 

"""
		println "✔ Creada: ${archivo}"
		println "  Recuerda: header completo, probar con ./gradlew test, NO editar si ya se aplicó."
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// ─────────────────────────────────────────────
	// [QUÉ]: Seguridad HTTP de Spring: cadena de filtros, autenticación y autorización.
	// [POR QUÉ]: FASE 11 añade login/JWT stateless con roles (TIPSTER/CLIENTE/ADMIN).
	//            Spring Security es el estándar del proceso de selección (ADR-003) y
	//            provee BCrypt para el hashing de contraseñas.
	// [ALTERNATIVAS]: Interceptores propios o servlet filters manuales; se descartan
	//                 porque reinvientan el modelo de autorización sin ganar nada.
	// [RELACIONES]: infrastructure.security (SecurityConfig, JwtAuthenticationFilter),
	//               JwtTokenEmisor, BcryptPasswordHasher (FASE 11).
	// ─────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// ─────────────────────────────────────────────
	// [QUÉ]: Librería JJWT para crear y validar tokens JWT (HS256).
	// [POR QUÉ]: FASE 11 emite un JWT firmado en login y lo valida en cada request.
	//            jjwt-api (compilación) + jjwt-impl y jjwt-jackson (runtime) evitan
	//            acoplar dependencias de implementación al código.
	// [ALTERNATIVAS]: spring-security-oauth2-jose (Nimbus); se descarta porque JJWT es
	//                 más directo para emitir/validar HS256 y ampliamente conocido.
	// [RELACIONES]: JwtTokenEmisor, JwtAuthenticationFilter (FASE 11).
	// ─────────────────────────────────────────────
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// ─────────────────────────────────────────────
	// [QUÉ]: Persistencia relacional con JPA/Hibernate sobre PostgreSQL (FASE 8).
	// [POR QUÉ]: Los repository ports (application.port.XxxRepository) se implementan
	//            con Spring Data JPA + PostgreSQL 17. PostgreSQL es el motor objetivo
	//            (docker-compose en FASE 9); no se usa H2 porque el objetivo es prod.
	// [ALTERNATIVAS]: MyBatis o JDBC puro; se descartan porque JPA + Spring Data
	//                 reduce el boilerplate de mapeo y da transaccionalidad declarativa.
	// [RELACIONES]: infrastructure.persistence.entity/repository/adapter (FASE 8).
	// ─────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	// ─────────────────────────────────────────────
	// [QUÉ]: Flyway — migraciones versionadas del esquema (H-05).
	// [POR QUÉ]: ddl-auto=update no borra ni transforma y las migraciones manuales V3/V4/V5
	//            no dejaban rastro. Con Flyway el esquema es reproducible/auditable y los
	//            tests (Testcontainers) validan los mismos .sql que producción.
	//            flyway-database-postgresql es requerido por Flyway 10+ por motor.
	// [ALTERNATIVAS]: Liquibase; se descarta porque Flyway es el estándar simple SQL-first.
	// [RELACIONES]: db/migration/V1__baseline.sql; ddl-auto=validate en properties.
	// ─────────────────────────────────────────────
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springframework.boot:spring-boot-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	// ─────────────────────────────────────────────
	// [QUÉ]: Cliente Redis para el cache-aside de lecturas de fuentes externas.
	// [POR QUÉ]: FASE 12 implementa cache-aside sobre los proveedores de posiciones,
	//            calendario y cuotas (evita golpear el scraper en cada sincronización);
	//            Spring Data Redis aporta el StringRedisTemplate con TTL por clave.
	// [ALTERNATIVAS]: Caffeine (L1 local) como cache único; se descarta en FASE 12 para
	//                 no perder el valor de cache compartido/durable de Redis y porque el
	//                 plan lo define; queda previsto como L1 opcional en un futuro
	//                 CompositeCacheAdapter (FASE 17) sin tocar los casos de uso.
	// [RELACIONES]: infrastructure.cache.RedisCacheAdapter + decoradores
	//               ProveedorXxxCacheable (FASE 12).
	// ─────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // ─────────────────────────────────────────────
    // [QUÉ]: Encoder JSON para Logback (logs estructurados con MDC) (FASE 12.6).
    // [POR QUÉ]: Los logs del scheduler y de las sincronizaciones se emiten en JSON
    //            (logback-spring.xml) para correlacionarlos en ELK/Loki/Grafana usando
    //            el executionId del MDC; logstash-logback-encoder es el estándar de
    //            facto para ello y no requiere cambiar el API de logging (SLF4J).
    // [ALTERNATIVAS]: Serializar logs a JSON manualmente en un appender propio; se
    //                 descarta por reinventar lo que ya aporta el encoder. Logback
    //                 clásico en texto plano; se descarta porque pierde trazabilidad
    //                 estructurada para el pipeline de observabilidad.
    // [RELACIONES]: logback-spring.xml + MDCTaskContext + CatalogoScheduler (FASE 12.6).
    // ─────────────────────────────────────────────
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
	// ─────────────────────────────────────────────
	// [QUÉ]: Soporte Testcontainers para tests de integración de los adapters JPA.
	// [POR QUÉ]: Los repository adapters se prueban contra un PostgreSQL real en
	//            contenedor (regla testing.md), no contra la BD local de dev.
	// [ALTERNATIVAS]: H2 embebido; se descarta porque no valida SQL/DDL de PostgreSQL
	//                 ni las constraints reales del motor objetivo.
	// [RELACIONES]: Tests de infrastructure.persistence (FASE 8, profundizado en FASE 10).
	// ─────────────────────────────────────────────
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
	// [POR QUÉ]: Los tests de cache (RedisCacheAdapterTest) levantan un Redis real con
	//             GenericContainer("redis:7-alpine") desde el core org.testcontainers;
	//             NO existe módulo testcontainers-redis en la línea 2.0.5 (los módulos
	//             específicos se renombraron). El core ya viene de las líneas anteriores.
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
